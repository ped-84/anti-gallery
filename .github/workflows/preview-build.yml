name: Preview build

# Typechecks and builds every push to a claude/** branch and keeps the built
# site plus the logs as a downloadable artifact, so work can be checked in a
# browser before a PR is opened. Read-only: it never deploys or pushes.
on:
  push:
    branches: ['claude/**']

permissions:
  contents: read

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --ignore-scripts

      - name: Typecheck and build (logs are kept in the artifact)
        run: |
          set +e
          npx tsc --noEmit > tsc.log 2>&1; echo "tsc exit $?" >> tsc.log
          npm run build > build.log 2>&1; echo "build exit $?" >> build.log
          mkdir -p out
          [ -d dist ] && cp -r dist/. out/
          cp tsc.log build.log out/
          echo "${GITHUB_SHA}" > out/SOURCE_SHA

      - uses: actions/upload-artifact@v4
        with:
          name: preview
          path: out
          retention-days: 3

      # Artifact storage is not reachable from the agent's sandbox, but job logs
      # are. Print only the files the build generated (public/ is in the repo)
      # as base64 so the preview can be rebuilt from `gh run view --log`.
      - name: Print generated files for the agent preview
        run: |
          cd out
          find . -type f | sed 's|^\./||' | while read -r f; do [ -e "../public/$f" ] || echo "$f"; done > ../generated.txt
          tar czf ../generated.tgz -T ../generated.txt
          cd ..
          echo "PVB64-BEGIN $(stat -c%s generated.tgz) $(sha256sum generated.tgz | cut -c1-64)"
          base64 -w 60000 generated.tgz | sed 's/^/PVB64:/'
          echo "PVB64-END"

      - name: Fail if typecheck or build failed
        run: grep -q 'tsc exit 0' tsc.log && grep -q 'build exit 0' build.log
