name: Production CI/CD Pipeline (Registry-Free SSH)

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    name: Build & Direct Deploy to Primary and Mirror
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Typecheck
        run: npm exec tsc -- --noEmit

      - name: Build Production Frontend
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Self-Contained Docker Image
        run: |
          docker build -t artgasht:latest .
          docker save artgasht:latest | gzip > artgasht.tar.gz

      - name: Configure SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PRIMARY_SSH_KEY }}

      - name: Deploy to PRIMARY (Germany VPS - artgasht.com)
        if: env.HAS_PRIMARY_SECRET == 'true'
        env:
          HAS_PRIMARY_SECRET: ${{ secrets.PRIMARY_HOST != '' }}
          PRIMARY_HOST: ${{ secrets.PRIMARY_HOST }}
          PRIMARY_USER: ${{ secrets.PRIMARY_USER || 'root' }}
          PRIMARY_PORT: ${{ secrets.PRIMARY_PORT || 22 }}
          REMOTE_DIR: ${{ secrets.PRIMARY_DIR || '/opt/artgasht' }}
        run: |
          echo "Connecting to PRIMARY ($PRIMARY_HOST)..."
          ssh-keyscan -p $PRIMARY_PORT $PRIMARY_HOST >> ~/.ssh/known_hosts

          ssh -p $PRIMARY_PORT $PRIMARY_USER@$PRIMARY_HOST "mkdir -p $REMOTE_DIR/data/uploads $REMOTE_DIR/scripts"

          echo "Streaming image to PRIMARY..."
          cat artgasht.tar.gz | ssh -p $PRIMARY_PORT $PRIMARY_USER@$PRIMARY_HOST "gzip -d | docker load"

          scp -P $PRIMARY_PORT docker-compose.yml Caddyfile $PRIMARY_USER@$PRIMARY_HOST:$REMOTE_DIR/
          scp -P $PRIMARY_PORT scripts/*.sh scripts/*.cjs $PRIMARY_USER@$PRIMARY_HOST:$REMOTE_DIR/scripts/
          ssh -p $PRIMARY_PORT $PRIMARY_USER@$PRIMARY_HOST "chmod +x $REMOTE_DIR/scripts/*.sh $REMOTE_DIR/scripts/*.cjs 2>/dev/null || true"

          ssh -p $PRIMARY_PORT $PRIMARY_USER@$PRIMARY_HOST "cd $REMOTE_DIR && docker compose up -d --force-recreate"
          sleep 4
          ssh -p $PRIMARY_PORT $PRIMARY_USER@$PRIMARY_HOST "curl -fs http://127.0.0.1:3000/health"
          echo "PRIMARY deployed successfully!"

      - name: Forward Image from PRIMARY to MIRROR (Iran VPS - artgasht.ir)
        if: env.HAS_MIRROR_SECRET == 'true'
        continue-on-error: true # Prevents CI failure if Iran international gateway is severed
        env:
          HAS_MIRROR_SECRET: ${{ secrets.MIRROR_HOST != '' }}
          PRIMARY_HOST: ${{ secrets.PRIMARY_HOST }}
          PRIMARY_USER: ${{ secrets.PRIMARY_USER || 'root' }}
          PRIMARY_PORT: ${{ secrets.PRIMARY_PORT || 22 }}
          MIRROR_HOST: ${{ secrets.MIRROR_HOST }}
          MIRROR_USER: ${{ secrets.MIRROR_USER || 'root' }}
          MIRROR_PORT: ${{ secrets.MIRROR_PORT || 22 }}
          MIRROR_DIR: ${{ secrets.MIRROR_DIR || '/opt/artgasht' }}
        run: |
          echo "Triggering direct transfer from PRIMARY to MIRROR ($MIRROR_HOST)..."
          ssh -p $PRIMARY_PORT $PRIMARY_USER@$PRIMARY_HOST "
            set -e
            echo 'Streaming docker image to MIRROR over internal/outbound channel...'
            docker save artgasht:latest | gzip | ssh -o ConnectTimeout=25 -p $MIRROR_PORT $MIRROR_USER@$MIRROR_HOST 'gzip -d | docker load'
            ssh -p $MIRROR_PORT $MIRROR_USER@$MIRROR_HOST 'cd $MIRROR_DIR && docker compose up -d --force-recreate'
            sleep 3
            ssh -p $MIRROR_PORT $MIRROR_USER@$MIRROR_HOST 'curl -s http://127.0.0.1:3000/health'
          " || echo "Notice: Forwarding to MIRROR timed out (possible national shutdown in progress). Image is safely live on PRIMARY."
