# ========================================================
# Docker Compose for Anti-Gallery (آرت‌گشت)
# Primary Server: Frankfurt VPS (artgasht.com)
# Runs as non-root user (1000:1000) matching host 'deploy' user
# ========================================================

services:
  app:
    image: artgasht:latest
    container_name: artgasht-app
    user: "1000:1000"
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATA_DIR=/app/data
    ports:
      # Binds to localhost only; public traffic handled by Caddy reverse proxy
      - "127.0.0.1:3000:3000"
    volumes:
      # Bind-mount host data directory (owned by deploy:deploy 1000:1000)
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
