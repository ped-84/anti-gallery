      <div id="splash-loader" style="position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; z-index: 99999; font-family: 'Shabnam FD', system-ui, sans-serif; direction: rtl; text-align: center;">

          .splash-logo-dark { display: none; width: 100%; height: 100%; object-fit: contain; }
          .dark .splash-logo-light { display: none; }
          .dark .splash-logo-dark { display: block; }
          .splash-subtitle {
            font-size: 13.5px;
            font-weight: 700;
            color: #3D5B99;
            margin: 0;
            letter-spacing: -0.2px;
          }

          }

            width: 24px;
            height: 24px;
            border: 2.5px solid rgba(247, 107, 28, 0.2);
            border-top-color: #F76B1C;
            border-radius: 50%;
            animation: splash-spin 0.8s linear infinite;

        <div id="splash-recovery" style="display: none; flex-direction: column; align-items: center; gap: 8px; margin-top: 14px;">
          <p style="font-size: 11.5px; color: #64748b; margin: 0;">بارگذاری بیش از حد طول کشید</p>
          <button type="button" onclick="window.__artgasht_force_refresh && window.__artgasht_force_refresh()" style="background: #3D5B99; color: #ffffff; border: none; padding: 7px 16px; border-radius: 12px; font-size: 12px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 10px rgba(61,91,153,0.25);">
            بارگذاری مجدد و پاک‌سازی حافظه موقت
          </button>
        </div>
      </div>

    <script>
      window.__artgasht_mounted = false;
      window.__artgasht_force_refresh = function() {
        try {
          if ('caches' in window) {
            caches.keys().then(function(keys) {
              keys.forEach(function(k) { caches.delete(k); });
            });
          }
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              regs.forEach(function(r) { r.unregister(); });
            });
          }
        } catch (e) {}
        setTimeout(function() {
          var cleanUrl = window.location.origin + window.location.pathname + '?reload=' + Date.now();
          window.location.replace(cleanUrl);
        }, 150);
      };

      // Auto-catch Stale Chunk or Unexpected Token errors
      window.addEventListener('error', function(e) {
        var msg = (e && e.message) ? e.message.toLowerCase() : '';
        if (msg.indexOf('unexpected token') !== -1 || msg.indexOf('loading chunk') !== -1 || msg.indexOf('failed to fetch') !== -1 || msg.indexOf('import') !== -1) {
          console.warn('[Artgasht Recovery] Script mismatch detected:', msg);
          if (!sessionStorage.getItem('__artgasht_auto_reloaded')) {
            sessionStorage.setItem('__artgasht_auto_reloaded', '1');
            window.__artgasht_force_refresh();
          }
        }
      });

      // Watchdog: If not mounted after 6.5s, reveal the recovery button
      setTimeout(function() {
        if (!window.__artgasht_mounted) {
          var rec = document.getElementById('splash-recovery');
          if (rec) rec.style.display = 'flex';
        }
      }, 6500);
    </script>
